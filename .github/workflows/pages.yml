name: Publish web

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'data/**'
      - 'modules/**'
      - 'vendor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout web files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /index.html
            /404.html
            /app.js
            /config.js
            /styles.css
            /assets/
            /data/
            /modules/
            /vendor/
          sparse-checkout-cone-mode: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble web site
        run: |
          mkdir public
          cp index.html 404.html app.js config.js styles.css public/
          cp -R assets data modules vendor public/
          touch public/.nojekyll
          test -s public/modules/network-import.js
          test -s public/vendor/xlsx.full.min.js
          du -sh public
      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
